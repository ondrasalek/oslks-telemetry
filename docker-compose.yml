services:
    # --- 1. Database (TimescaleDB) ---
    db:
        image: timescale/timescaledb:latest-pg16
        container_name: oslks-db
        restart: unless-stopped
        shm_size: 1gb # CRITICAL: Essential for TimescaleDB batch inserts
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: '1G'
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-oslks}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oslks}'
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - coolify

    # --- 2. Application (collector + dashboard API + SPA, one image) ---
    # s6-overlay supervises all three processes; only Caddy on :80 is exposed.
    # Startup order is enforced inside the container: the collector applies the
    # migrations first, and the dashboard API waits for it to report healthy.
    app:
        image: 'git.slks.cz/oslks/oslks-radar:${IMAGE_TAG:-latest}'
        container_name: oslks-app
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        deploy:
            resources:
                limits:
                    cpus: '1.2'
                    memory: '768M'
        environment:
            - DATABASE_URL
            - SESSION_SECRET
            - CORS_ALLOWED_ORIGINS
            - RUST_LOG
            - GEOIP_DB_PATH
            - SMTP_HOST
            - SMTP_PORT
            - SMTP_USER
            - SMTP_PASSWORD
            - SMTP_FROM_EMAIL
            - SMTP_FROM_NAME
        depends_on:
            db:
                condition: service_healthy
        labels:
            - traefik.enable=true
            - traefik.http.routers.oslks-frontend.rule=Host(`radar.slks.cz`)
            - traefik.http.routers.oslks-frontend.entrypoints=websecure
            - traefik.http.routers.oslks-frontend.tls.certresolver=letsencrypt
            - traefik.http.routers.oslks-frontend.middlewares=
            - traefik.http.routers.oslks-frontend-http.rule=Host(`radar.slks.cz`)
            - traefik.http.routers.oslks-frontend-http.entrypoints=web
            - traefik.http.routers.oslks-frontend-http.middlewares=
            - traefik.http.services.oslks-frontend.loadbalancer.server.port=80
        # Probes all three processes — a dead API must not read as healthy.
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl -fsS -o /dev/null http://127.0.0.1:8080/health && curl -fsS -o /dev/null http://127.0.0.1:8081/health && curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1'
            interval: 15s
            timeout: 5s
            start_period: 45s
            retries: 5
        networks:
            - coolify

volumes:
    postgres_data:

networks:
    coolify:
        external: true
