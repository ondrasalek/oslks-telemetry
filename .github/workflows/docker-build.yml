name: Build and Push Docker Image

on:
    push:
        branches:
            - main
        paths:
            - 'backend/**'
            - 'dashboard-api/**'
            - 'frontend-react/**'
            - 'docker/**'
            - 'Dockerfile'
            - 'docker-compose.yml'
            - '.github/workflows/docker-build.yml'
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Single image: collector + dashboard-api + SPA under s6-overlay
            - name: Build and push oslks-radar
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/oslks-radar:latest
                      ghcr.io/${{ github.repository_owner }}/oslks-radar:${{ github.sha }}
                  build-args: |
                      VITE_APP_URL=${{ secrets.VITE_APP_URL || 'https://radar.slks.cz' }}
                      VITE_OSLKS_COLLECTOR_URL=${{ secrets.VITE_OSLKS_COLLECTOR_URL || 'https://assets.slks.cz' }}
                      VITE_OSLKS_WEBSITE_ID=${{ secrets.VITE_OSLKS_WEBSITE_ID || 'be6d2ce9-93f6-4a8b-8cc0-cbb39c443e17' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
